<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>HA 登入稽核</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6f8;--card:#fff;--text:#18212b;--muted:#617080;--line:#dce2e8;--ok:#16803d;--bad:#bd2c2c;--safe:#e6f6ec;--warn:#fff0ee}@media(prefers-color-scheme:dark){:root{--bg:#101418;--card:#1b2229;--text:#edf2f7;--muted:#a8b4c0;--line:#34404b;--safe:#143824;--warn:#492020}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,sans-serif}main{max-width:1500px;margin:auto;padding:20px}.top,.form-row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1,h2{margin:0}.muted{color:var(--muted)}button{border:0;border-radius:8px;padding:9px 13px;background:#03a9f4;color:white;cursor:pointer}.secondary{background:#607d8b}.danger{background:#c62828}.mini{padding:5px 8px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));gap:12px;margin:18px 0}.card,.settings{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}.number{font-size:28px;font-weight:700;margin-top:5px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.form-row input{flex:1;min-width:180px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:5px 8px}.tabs{display:flex;gap:8px;margin:18px 0 10px}.tab{background:transparent;color:var(--text);border:1px solid var(--line)}.tab.active{background:#03a9f4;color:#fff}.table-wrap{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line)}th{position:sticky;top:0;background:var(--card)}tr.safe{background:var(--safe)}tr.blacklist{background:var(--warn)}.badge{display:inline-block;padding:3px 8px;border-radius:99px;font-weight:600}.badge.safe{color:var(--ok);background:var(--safe)}.badge.blacklist{color:#fff;background:#b71c1c}.badge.unknown{color:var(--bad);background:var(--warn)}.agent{max-width:340px;overflow:hidden;text-overflow:ellipsis}#error{color:var(--bad);margin:12px 0}.hide{display:none}@media(max-width:750px){main{padding:12px}.cards,.settings-grid{grid-template-columns:1fr}th,td{padding:9px 8px}}
</style></head><body><main><div class="top"><div><h1>Home Assistant 登入稽核</h1><div class="muted" id="updated">載入中…</div></div><button onclick="loadAudit()">重新整理</button></div><div id="error"></div>
<section class="cards"><div class="card">成功工作階段<div class="number" id="successCount">-</div></div><div class="card">登入失敗<div class="number" id="failureCount">-</div></div><div class="card">黑名單命中<div class="number" id="blackCount">-</div></div></section>
<section class="settings-grid"><div class="settings"><h2>安全 IP 名單</h2><p class="muted">標記為可信任，可輸入單一 IP 或 CIDR。</p><div class="form-row"><input id="safeInput" placeholder="例如 203.0.113.10 或 192.168.1.0/24"><button onclick="addIp('safe')">新增</button></div><div class="chips" id="safeChips"></div></div>
<div class="settings"><h2>黑名單</h2><p class="muted">單一 IP 可同步 HA IP Ban；CIDR 僅作稽核標記。</p><div class="form-row"><input id="blackInput" placeholder="例如 198.51.100.20"><button class="danger" onclick="addIp('blacklist')">新增</button></div><div class="chips" id="blackChips"></div></div></section>
<section class="settings"><div class="top"><div><h2>Home Assistant IP Ban 同步</h2><p class="muted" id="banStatus">讀取中…</p></div><button class="danger hide" id="restartButton" onclick="applyRestart()">套用並重啟 HA</button></div></section>
<div class="tabs"><button class="tab active" onclick="showTab('failure',this)">登入失敗</button><button class="tab" onclick="showTab('success',this)">登入成功</button></div>
<div id="failure" class="table-wrap"><table><thead><tr><th>時間</th><th>來源 IP</th><th>判定</th><th>名單操作</th><th>裝置／瀏覽器</th><th>請求</th></tr></thead><tbody></tbody></table></div>
<div id="success" class="table-wrap hide"><table><thead><tr><th>建立時間</th><th>使用者</th><th>最後使用</th><th>來源 IP</th><th>判定</th><th>名單操作</th><th>登入端</th></tr></thead><tbody></tbody></table></div>
<script>
let model={safe_ips:[],blacklist_ips:[]};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const time=s=>s?new Date(s.includes('T')?s:s.replace(' ','T')).toLocaleString('zh-TW'):'—';
function badge(c){return c==='safe'?'<span class="badge safe">安全 IP</span>':c==='blacklist'?'<span class="badge blacklist">黑名單</span>':'<span class="badge unknown">未分類</span>'}function actions(ip){if(!ip)return '—';return `<button class="mini" onclick="quickAdd('safe','${esc(ip)}')">安全</button> <button class="mini danger" onclick="quickAdd('blacklist','${esc(ip)}')">黑名單</button>`}function showTab(id,b){document.querySelectorAll('.table-wrap').forEach(x=>x.classList.add('hide'));document.getElementById(id).classList.remove('hide');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
function renderLists(){safeChips.innerHTML=model.safe_ips.map((x,i)=>`<span class="chip">${esc(x)} <button class="mini secondary" onclick="removeIp('safe',${i})">×</button></span>`).join('')||'<span class="muted">尚未設定</span>';blackChips.innerHTML=model.blacklist_ips.map((x,i)=>`<span class="chip">${esc(x)} <button class="mini secondary" onclick="removeIp('blacklist',${i})">×</button></span>`).join('')||'<span class="muted">尚未設定</span>'}
function renderBanStatus(){const s=model.ip_ban_sync||{},exact=(s.exact_blacklist_ips||[]).length,cidrs=(s.audit_only_cidrs||[]).length;banStatus.textContent=`已同步 ${exact} 個單一 IP${cidrs?`；${cidrs} 個 CIDR 僅作稽核標記`:''}${s.restart_required?'；等待重新啟動後生效':'；目前沒有待套用變更'}`;restartButton.classList.toggle('hide',!s.restart_required)}
async function saveLists(){const r=await fetch('api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({safe_ips:model.safe_ips,blacklist_ips:model.blacklist_ips})});if(!r.ok)throw new Error(await r.text());const d=await r.json();model.safe_ips=d.safe_ips;model.blacklist_ips=d.blacklist_ips;await loadAudit()}
async function addIp(type){const input=type==='safe'?safeInput:blackInput,value=input.value.trim();if(!value)return;const key=type==='safe'?'safe_ips':'blacklist_ips';if(!model[key].includes(value))model[key].push(value);input.value='';try{await saveLists()}catch(e){error.textContent='儲存失敗：'+e.message}}
async function quickAdd(type,ip){const add=type==='safe'?'safe_ips':'blacklist_ips',remove=type==='safe'?'blacklist_ips':'safe_ips';model[remove]=model[remove].filter(x=>x!==ip);if(!model[add].includes(ip))model[add].push(ip);try{await saveLists()}catch(e){error.textContent='儲存失敗：'+e.message}}
async function removeIp(type,index){model[type==='safe'?'safe_ips':'blacklist_ips'].splice(index,1);try{await saveLists()}catch(e){error.textContent='儲存失敗：'+e.message}}
async function applyRestart(){if(!confirm('Home Assistant Core 將立即重新啟動，約需 1–3 分鐘。確定套用 IP Ban？'))return;restartButton.disabled=true;try{const r=await fetch('api/restart',{method:'POST'});if(!r.ok)throw new Error(await r.text());banStatus.textContent='Home Assistant 正在重新啟動…';restartButton.classList.add('hide')}catch(e){error.textContent='重新啟動失敗：'+e.message;restartButton.disabled=false}}
async function loadAudit(){error.textContent='';try{const r=await fetch('api/audit',{cache:'no-store'});if(!r.ok)throw new Error(await r.text());const d=await r.json();model=d;renderLists();renderBanStatus();successCount.textContent=d.successes.length;failureCount.textContent=d.failures.length;blackCount.textContent=d.failures.filter(x=>x.classification==='blacklist').length;updated.textContent='更新：'+time(d.generated_at);document.querySelector('#failure tbody').innerHTML=d.failures.map(x=>`<tr class="${x.classification}"><td>${time(x.timestamp)}</td><td>${esc(x.ip)}</td><td>${badge(x.classification)}</td><td>${actions(x.ip)}</td><td class="agent" title="${esc(x.agent)}">${esc(x.agent||'—')}</td><td>${esc(x.url)}</td></tr>`).join('')||'<tr><td colspan="6">目前沒有失敗紀錄</td></tr>';document.querySelector('#success tbody').innerHTML=d.successes.map(x=>`<tr class="${x.classification}"><td>${time(x.created_at)}</td><td>${esc(x.user)}</td><td>${time(x.last_used_at)}</td><td>${esc(x.ip||'—')}</td><td>${badge(x.classification)}</td><td>${actions(x.ip)}</td><td>${esc(x.client)}</td></tr>`).join('')||'<tr><td colspan="7">目前沒有成功紀錄</td></tr>'}catch(e){error.textContent='載入失敗：'+e.message}}
loadAudit();setInterval(loadAudit,60000);
</script></main></body></html>
